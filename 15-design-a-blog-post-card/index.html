<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Blog Post Card</title>
</head>
<body>
    <div class="blog-post-card">
        <img class="post-img" src="https://cdn.freecodecamp.org/curriculum/labs/cover-photo.jpg" alt="Close-up of a person's hands typing on a laptop keyboard with a computer monitor blurred in the background.">

        <div class="post-content">
            <h2 class="post-title">Master Web Development in 2026</h2>
            <p class="post-excerpt">Accelerate your career with next-generation coding skills. Explore cutting-edge tools and frameworks shaping the modern web today.</p>
            <a href="#" class="read-more">Read More</a>
        </div>
    </div>

</body>
</html>
