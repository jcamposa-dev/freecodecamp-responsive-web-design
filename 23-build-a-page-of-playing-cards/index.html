<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Playing Cards</title>

  <link rel="stylesheet" href="styles.css">


</head>

<body>

  <main id="playing-cards">

    <div class="card">
      <div class="left">A♠
      </div>

      <div class="middle">♠
      </div>

      <div class="right"><div class="reverse-sign">A♠</div>
      </div>
    </div>

    <div class="card">
      <div class="left">2♣</div>

      <div class="middle">♣<div class="reverse-sign">♣</div>
      </div>

      <div class="right"><div class="reverse-sign">2♣</div>
      </div>
    </div>

    <div class="card card-red">
      <div class="left">3♥
      </div>

      <div class="middle">♥♥<div class="reverse-sign">♥</div>
      </div>

      <div class="right"><div class="reverse-sign">3♥</div>
      </div>
    </div>

    <div class="card">
      <div class="left">4♣
      </div>

      <div class="middle">♣♣<div class="reverse-sign">♣♣</div>
      </div>

      <div class="right"><div class="reverse-sign">4♣</div>
      </div>
      </div>
    </div>

    <div class="card card-red">
      <div class="left">5♦
      </div>

      <div class="middle">
        <div>♦♦</div>
        <div>♦</div>
        <div>♦♦</div>
      </div>

      <div class="right"><div class="reverse-sign">5♦</div>
      </div>
    </div>

  </main>

</body>

</html>
