<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Job Application Form</title>
</head>
<body>
    <main>
        <div class="container">
            <h1>Job Application Form</h1>
            <form>
                <label for="name">Full Name:</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    required
                  />    
                <label for="email">Email:</label>  
                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                  /> 
                <label for="position" required>Position:</label>   
                <select id="position" name="position-id">
                    <option value="backend">Select a position</option> 
                    <option value="backend">Frontend</option>  
                    <option value="backend">Backend</option> 
                    <option value="manager">Manager</option> 
                </select>

                <fieldset  class="radio-group">
                    <legend>Availability:</legend>
                    <input
                    type="radio"
                    id="full-time"
                    name="availability"
                    value="full-time"
                    checked
                      />  
                    <label for="full-time">Full-Time</label> 
                
                    <input
                    type="radio"
                    id="part-time"
                    name="availability"
                    value="part-time"
                      />
                    <label for="part-time">Part-Time</label>   
                </fieldset>  

                <label for="message">Why do you want this job?</label>
                <textarea id="message" required></textarea>

                <button type="submit">Submit Application</button>   

            </form>
        </div>
    </main>

</body>
</html>
