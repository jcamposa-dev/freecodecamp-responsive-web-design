<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Styled To-Do List</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <h1>My To-Do List</h1>
    <ul class="todo-list">
        <li>
        <input type="checkbox" id="explore-mech-keyb">
        <label for="explore-mech-keyb">Explore mechanical keyboards</label>
            <ul class="sub-item">
                <li>
                    <a class="sub-item-link" href="https://amazon.com" target="_blank">Check Store Inventory</a>
                </li>
            </ul>
        </li>

        <li>
        <input type="checkbox" id="review-proj-doc">
        <label for="review-proj-doc">Review project documentation</label>
            <ul class="sub-item">
                <li>
                    <a class="sub-item-link" href="https://google.com" target="_blank">Open Google Drive File</a>
                </li>
            </ul>
        </li>

        <li>
        <input type="checkbox" id="check-dev-warr-stat">
        <label for="check-dev-warr-stat">Check device warranty status</label>
            <ul class="sub-item">
                <li>
                    <a class="sub-item-link" href="https://apple.com" target="_blank">Go to Apple Support</a>
                </li>
            </ul>
        </li>

        <li>
        <input type="checkbox" id="comp-prec-specif">
        <label for="comp-prec-specif">Compare processor specifications</label>
            <ul class="sub-item">
                <li>
                    <a class="sub-item-link" href="https://intel.com View " target="_blank">Intel Database</a>
                </li>
            </ul>
        </li>
    </ul>

</body>

</html>
