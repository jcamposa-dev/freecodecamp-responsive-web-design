<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Checkout Page</title>
</head>

<body>
    <h1>Checkout</h1>

    <section>
        <h2>Your Cart</h2>
        <img src="https://cdn.freecodecamp.org/curriculum/labs/cube.jpg" alt="A 3D cube graphic with a reflective surface on a dark, textured background.">
        <p>$35</p>
        <p>Rubik's cube</p>
    </section>
        
    <section>
        <h2>Payment Information</h2>
        <form>
            <fieldset>
                <legend>Personal Information</legend>
                <label for="card-name">Cardholder Name <span aria-hidden="true">*</span></label>
                <input 
                id="card-name" 
                name="card-name" 
                type="text"
                autocomplete="name"
                required
                />

                <label for="card-number">Cardholder Number <span aria-hidden="true">*</span></label>
                <input 
                id="card-number" 
                name="card-number" 
                type="tel" 
                inputmode="numeric"
                minlength="16"
                maxlength="16"
                pattern="[0-9]{16}"
                autocomplete="cc-number"
                aria-describedby="card-number-help"
                required
                />

                <p id="card-number-help">Please enter your 16-digit card number without spaces or dashes.</p>

            </fieldset>

            <fieldset>
            <legend>Payment Details</legend>

                <label for="expiry-date">Expiry Date <span aria-hidden="true">*</span></label>
                <input 
                id="expiry-date" 
                name="expiry-date" 
                type="month"
                required
                />

                <label for="cvv-number">CVV <span aria-hidden="true">*</span></label>
                <input 
                id="cvv-number" 
                name="cvv-number" 
                type="tel" 
                inputmode="numeric"
                minlength="3"
                maxlength="3"
                pattern="[0-9]{3}"
                required
                />

            </fieldset>

            <button type="submit">Place Order</button>

        </form>
    </section>

</body>

</html>
